      <stop offset="0%" stop-color="#12263F"/>
      <stop offset="100%" stop-color="#1B3557"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft accent glow -->
  <circle cx="1050" cy="80" r="260" fill="#FF6B35" opacity="0.10"/>
  <circle cx="120" cy="600" r="200" fill="#7C3AED" opacity="0.12"/>

  <!-- wordmark -->
  <text x="80" y="210" font-family="'Noto Sans CJK TC','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="112" fill="#FFFFFF">COO</text>
  <rect x="389" y="109" width="22" height="132" rx="5" fill="#FF6B35"/><rect x="334" y="164" width="132" height="22" rx="5" fill="#FF6B35"/>
  <text x="452" y="210" font-family="'Noto Sans CJK TC','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="112" fill="#A78BFA">AI</text>
  <text x="620" y="210" font-family="'Noto Sans CJK TC','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="112" fill="#FFFFFF" opacity="0.55">酷台</text>

  <!-- headline -->
  <text x="80" y="345" font-family="'Noto Sans CJK TC','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="62" fill="#FFFFFF">你的 AI 營運長</text>
  <text x="80" y="425" font-family="'Noto Sans CJK TC','DejaVu Sans',Arial,sans-serif" font-weight="400" font-size="38" fill="#C9D4E3">自動回覆 · 語音聽得懂中文 · 24 小時不休息</text>

